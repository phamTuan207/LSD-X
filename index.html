<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử Đảng — Đại Hội X | Nhóm 4</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="badge">Nhóm 4 · Lịch Sử Đảng</span>
      <h1>Đại Hội Đại Biểu Toàn Quốc Lần Thứ X</h1>
      <p class="subtitle">Bộ câu hỏi trắc nghiệm — Trò chơi học tập</p>
    </div>
  </header>

  <main id="app" class="container">
    <section id="quiz" class="quiz" hidden>
      <div class="quiz-meta">
        <span id="quiz-section" class="quiz-section"></span>
        <span id="quiz-progress" class="quiz-progress"></span>
      </div>
      <div class="progress-bar" aria-hidden="true">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <article class="question-card">
        <h2 id="question-text" class="question-text"></h2>
        <div id="options" class="options"></div>
      </article>
    </section>
    <p id="loading" class="placeholder">Đang tải câu hỏi…</p>
  </main>

  <footer class="site-footer">
    <p>Lịch Sử Đảng Cộng sản Việt Nam · Nhóm 4 · Chạy trên localhost</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
